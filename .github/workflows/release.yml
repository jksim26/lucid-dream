name: release

# Pushing a tag like v0.2.0 builds the binary for each platform and attaches
# it to a GitHub release, so no device needs Rust to install lucid-dream.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: target/release/lucid-dream.exe
            asset: lucid-dream-windows-x64.exe
          - os: macos-latest
            file: target/release/lucid-dream
            asset: lucid-dream-macos-arm64
          - os: ubuntu-latest
            file: target/release/lucid-dream
            asset: lucid-dream-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked
        env:
          # Link the C runtime into the Windows binary so it runs on a PC
          # without the Visual C++ redistributable.
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ matrix.file }}" "${{ matrix.asset }}"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber

  # After every binary is attached: publish their checksums and the install
  # scripts, which refuse to install a download that does not match.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish checksums and install scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --dir assets --pattern 'lucid-dream-*'
          (cd assets && sha256sum lucid-dream-* > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS install.sh install.ps1 --clobber
