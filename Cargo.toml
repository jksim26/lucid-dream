[package]
name = "lucid-dream"
version = "0.6.0"
edition = "2021"
description = "One shared memory that every agent reads and dream tidies"
license = "MIT"
repository = "https://github.com/jksim26/lucid-dream"
readme = "README.md"

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
