[package]
name = "lucid-dream"
version = "0.2.3"
edition = "2021"
description = "One shared memory that every agent reads and dream tidies"

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
